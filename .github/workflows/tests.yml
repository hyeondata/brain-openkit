name: CLI tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI
        run: python -m pip install .
      - name: Test without a model download
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Installed CLI smoke checks
        run: |
          brain-openkit --version
          brain-openkit search "local search" --vault examples/vault --json
          brain-openkit evaluate examples/evaluation.jsonl --vault examples/vault --json
